name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Check Supabase secrets
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not set: skipping deploy."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.119.0

      - name: Copy notification and calendar keys to the functions
        if: steps.check.outputs.ready == 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          args=()
          for name in WEBHOOK_SECRET FIREBASE_SERVICE_ACCOUNT APNS_KEY_P8 APNS_KEY_ID APPLE_TEAM_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY EMAIL_FROM ADMIN_EMAIL APP_URL; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
          fi

      # --no-verify-jwt: each function checks its own caller (webhook secret, Stripe's
      # signature, Google's redirect, or the user's session).
      - name: Deploy functions
        if: steps.check.outputs.ready == 'true'
        run: |
          for fn in on-application-change google-calendar stripe-checkout stripe-webhook email-events; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done
